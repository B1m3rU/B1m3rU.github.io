title: "B1m3rU"
description: "Cybersecurity portfolio — CTF writeups, pentesting notes and tools."
theme: minima
author: "Enrique Álvarez González"

header_pages:
  - posts.md
  - machines.md
  - tags.md
  - about.md
  - contact.md

minima:
  skin: dark
  social_links:
    - { platform: github,  user_url: "https://github.com/B1m3rU" }
    - { platform: linkedin, user_url: "https://es.linkedin.com/in/enrique-alvarez-gonzalez" }

url: "https://b1m3ru.github.io"

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png

logo: /assets/img/og-default.png
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: /:categories/:title/
