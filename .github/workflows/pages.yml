name: Build, test & deploy

# Cualquier rama o PR: compila y pasa los tests.
# Solo un push a main publica (y solo si los tests pasan).
# Requiere Settings → Pages → Source: "GitHub Actions".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No cancelar un despliegue a medias (igual que la plantilla oficial de GitHub)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El mismo builder que usa el sistema clásico de GitHub Pages
      # (github-pages gem: Jekyll 3.10, minima 2.5.1, jekyll-seo-tag…)
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests — source
        run: python -m pytest tests/test_source.py -v

      - name: Tests — built site
        # http.server no sirve el 404.html personalizado; ese test se comprueba en producción
        run: |
          python -m http.server 4000 --directory _site --bind 127.0.0.1 &
          sleep 1
          SITE_URL=http://127.0.0.1:4000 python -m pytest tests/test_site.py -v -k "not custom_404"

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
